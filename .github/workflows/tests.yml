name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check --select F,E9 .
      - run: python run_game.py --check-dependencies
      - name: Native input sampling, routing and consumption without original game files
        run: python -m unittest -q tests.test_input_bank tests.test_input_routes tests.test_input_actions tests.test_input_traces tests.test_player_input
      - name: Ruins exit admission, head half-life HUD and waiting selection
        run: python -m unittest -q tests.test_ruins_fixes tests.test_opponent_selection
      - name: Coordinate conversions, frame phases and slot drawing
        run: python -m unittest -q tests.test_coordinates tests.test_frame_phases tests.test_slot_drawing tests.test_jump_descent tests.test_ruins_scenery_items.SharedSceneryNumberTests
      - name: Bundled application icon and native window identity
        run: python -m unittest -q tests.test_app_window
      - name: Native terminal animation pose and reload semantics
        run: python -m unittest -q tests.test_sequence_holds tests.test_sequence_noise tests.test_opponent_records tests.test_guard_rooms tests.test_opponent_selection
      - name: Checkpoint saves and integrated save-slot browser
        run: python -m unittest -q tests.test_save_slots
      - run: python -m unittest -q tests.test_audio_release tests.test_audio_loop tests.test_story_progress
      - name: Opposite gate motions and debris impact mixing
        run: python -m unittest -q tests.test_audio_duck tests.test_gate_audio tests.test_debris_audio
      - name: Throne gate and special ambient music
        run: python -m unittest -q tests.test_throne_room
      - name: Initially open gate drawing bindings
        run: python -m unittest -q tests.test_gate_scenery
      - name: Discovery animation import and isolated sound banks
        run: python -m unittest -q tests.test_discovery
      - name: Isolated level-four cavern scenery
        run: python -m unittest -q tests.test_level4
      - name: Approved level-five cavern artwork bundle
        run: python -m unittest -q tests.test_level5_cavern_retouch
      - name: Native head and temple reference rules without original game files
        run: python -m unittest discover -s tests -p "test_*_reference.py" -q
      - name: Native research inventory and fresh-call guards
        run: python -m unittest -q tests.test_inspect_level7 tests.test_inspect_temple tests.test_probe_level7_rules tests.test_native_rules_call_guard
      - name: Scythe patches and carpet animation export without original game files
        run: python -m unittest -q tests.test_scythes tests.test_carpet_scene.CarpetExportTests tests.test_carpet_scene.KidPaletteTests tests.test_carpet_scene.CarriedMusicTests tests.test_carpet_scene.AnimatedFadeTests
      - name: Host menu audio and isolated SDL UI channels
        run: python -m unittest -q tests.test_ui_audio
      - name: Tests without original game files
        run: python -m unittest -q tests.test_bootstrap tests.test_extract_assets tests.test_extract_audio tests.test_extract_intro tests.test_extract_attract tests.test_recorded_game tests.test_attract tests.test_intro tests.test_audio tests.test_playback_navigation tests.test_mac_resources tests.test_run_game tests.test_setup_game tests.test_recovery_catalog tests.test_project_layout tests.test_window_controls tests.test_bitmap_presenter tests.test_game_menu.GameMenuModelTests tests.test_palettes tests.test_game_session tests.test_level_ending
      - run: python -m tools.recovery_catalog --check
      - name: First-run import process and cancellation
        run: python -m unittest -q tests.test_asset_import tests.test_workers
      - name: Desert and cavern rules without original game files
        run: python -m unittest -q tests.test_desert tests.test_caverns tests.test_cavern_retouch tests.test_cavern_door_retouch tests.test_loose_floors tests.test_ceiling tests.test_ledge_catch tests.test_enemy_alerts tests.test_opponent_positions tests.test_stone_gates tests.test_gate_clearance tests.test_cavern_retry tests.test_gate_crush tests.test_lava tests.test_pressure_plates tests.test_cavern_exits tests.test_darts tests.test_potions tests.test_wall_spikes
      - name: Screenshot export and game-menu capture controls
        run: python -m unittest -q tests.test_screenshots tests.test_screenshot_gallery tests.test_bitmap_labels tests.test_development_menu.MenuModelTests
      - name: Developer preview models and cache without original game files
        run: python -m unittest -q tests.test_preview_cache tests.test_development_map.DevelopmentMapModelTests tests.test_playback_preview.GalleryModelTests tests.test_development_cheats
