name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check --select F,E9 .
      - run: python run_game.py --check-dependencies
      - name: Tests without original game files
        run: python -m unittest -q test_bootstrap test_extract_assets test_mac_resources test_run_game test_setup_game test_recovery_catalog
      - run: python recovery_catalog.py --check
